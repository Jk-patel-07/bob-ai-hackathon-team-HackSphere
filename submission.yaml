submission:
  title: "Chip Design Knowledge Assistant" # REQUIRED — Project display name

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Semiconductor engineers spend significant time navigating complex physical design rules,
    standard cell guidelines, and DRC/latchup specifications scattered across multi-page manuals.
    Context switching and missed specification details slow down design verification cycles.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    We built a retrieval-augmented generation assistant for chip design knowledge using Google Gemini API / watsonx.ai,
    FastAPI, ChromaDB, PyMuPDF, and an IBM Bob MCP server. The system is designed to minimize hallucinations
    by grounding answers in retrieved documents and returning an explicit insufficient-information response when supporting evidence is unavailable.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Strict grounded Q&A with document chunk citation deduplication and low-confidence fallback"
    - "Configurable AI provider layer supporting Google Gemini API (gemini-2.5-flash) and IBM watsonx.ai"
    - "IBM Bob integration via standard Model Context Protocol (MCP) STDIO server tools"
    - "Document & Knowledge Base management API (Upload, List, Delete, Filtering)"
    - "Single-port SPA deployment with reactive status indicator and category filters"

  tech_stack:
    languages: ["Python", "TypeScript", "HTML", "CSS"]
    frameworks: ["FastAPI", "React", "Vite", "TailwindCSS"]
    ibm_technologies: ["IBM Bob (MCP Protocol)", "watsonx.ai (Supported Alternative)"]
    databases: ["ChromaDB"]
    other: ["Google Gemini API (google-genai)", "PyMuPDF", "LangChain Text Splitters", "Pydantic", "pytest", "Uvicorn"]

  what_we_are_most_proud_of: >
    The strict anti-hallucination grounding architecture and seamless dual interface — allowing engineers to query chip design specifications either via the web frontend or directly inside IBM Bob via Model Context Protocol (MCP) tools.

  known_limitations: >
    This hackathon prototype / MVP relies on synthetic demo data rather than proprietary foundry PDK rules. Advanced authentication/RBAC and multi-user ACLs are scaffolded for local single-tenant execution.

